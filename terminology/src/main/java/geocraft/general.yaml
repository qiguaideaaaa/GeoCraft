# yaml-language-server: $schema=../.schema.json
# 天圆地方 GeoCraft 术语表 —— 通用概念与系统交集
# 范围：跨系统共用的框架级基础概念（层级、地理属性/状态、海拔、配置类型、方块更新器等）。
# 格式与规则见本目录 README.md。

- 中文: "映射表"
  英文: "Map"
  定义: "本模组基于 Forge 配置文件字符串列表定义的新配置类型，表示一系列具有映射关系的数据。"
  出处:
    - "https://www.mcmod.cn/item/892905.html"
    - 类: moe.qingu.geocraft.api.configs.item.map.ConfigMap

- 中文: "方块状态选择器"
  英文: "Block State Selector"
  别称:
    - []
    - ["Configurable Block State"]
  定义: "本模组配置文件中用以选择一种或多种方块状态的值类型。"
  出处:
    - "https://www.mcmod.cn/item/892906.html"
    - 类: moe.qingu.geocraft.api.configs.value.minecraft.ConfigurableBlockState

- 中文: "热容"
  英文: "Heat Capacity"
  定义: "天圆地方对方块添加的属性，也是层级的一种地理属性，表示温度每升高一单位所需吸收的热量。"
  出处:
    - "https://www.mcmod.cn/item/905244.html"

- 中文: "反射率"
  英文: null
  定义: "天圆地方为方块添加的物理属性之一，可经 /atmosphere util 查询。"
  出处: "https://www.mcmod.cn/item/927875.html"

- 中文: "延迟警报"
  英文: null
  定义: "天圆地方自带性能监控机制的预警信息之一，有限模式流体物理系统据此限制流动计算开销。"
  出处: "https://www.mcmod.cn/item/919288.html"

- 中文: "延迟应急响应"
  英文: null
  定义: "天圆地方性能监控机制中比延迟警报更高的预警信息。"
  出处: "https://www.mcmod.cn/item/919288.html"

  # =========== 调度 ==========

- 中文: "方块计划刻调度器"
  英文: "Block Tick Scheduler"
  定义: "天圆地方对原版计划刻调度的重新实现"
  别称:
    - ["计划刻调度器","调度器"]
    - ["Tick Scheduler","Scheduler"]
  出处:
    - "https://www.mcmod.cn/item/904958.html"
    - 类: moe.qingu.geocraft.api.world.tick.scheduler.BlockTickScheduler

- 中文: "计划刻"
  英文: "Scheduled Tick"
  别称:
    - [ "更新计划" ]
    - [ "Next Tick Entry","NTE" ]
  定义: "方块计划刻调度器中记录一次延时方块更新的条目。"
  出处:
    - "https://www.mcmod.cn/item/904958.html"
    - 类: net.minecraft.world.NextTickListEntry
    - 类: moe.qingu.geocraft.api.world.tick.IScheduledTick

- 中文: "偏序调度"
  英文: "Partial Order Schedule"
  定义: "指仅在有限连续区域内计划刻调度满足标准计划刻调度顺序的调度方式"
  出处:
    - 类: moe.qingu.geocraft.world.scheduler.GeoBlockTickType

- 中文: "全序调度"
  英文: "Total Order Schedule"
  定义: "对于一个维度所有可进行计划刻更新的区域所包含的计划刻，顺序满足标准计划刻调度顺序的调度方式"
  出处:
    - 类: moe.qingu.geocraft.world.scheduler.GeoBlockTickType

- 中文: "打包"
  英文: "Packed"
  定义: "调度器的一种数据存储方式，指计划刻数据通过位运算紧密存储的方式。"
  出处:
    - 类: moe.qingu.geocraft.world.scheduler.GeoBlockTickType

- 中文: "装箱"
  英文: "Boxed"
  定义: "调度器的一种数据存储方式，指计划刻数据打包成对象存储的方式"
  出处:
    - 类: moe.qingu.geocraft.world.scheduler.GeoBlockTickType

- 中文: "区块型调度器"
  英文: "Chunky Scheduler"
  定义: "基于区块模型设计的调度器"
  出处:
    - 类: moe.qingu.geocraft.world.scheduler.ChunkyBlockTickScheduler

