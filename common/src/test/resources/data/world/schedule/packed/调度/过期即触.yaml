# Claude Generated
# 入队时名义触发刻已过（时 95、99）或恰为当刻（时 100）的任务都在首轮消费，
# 三条都在首刻 t=100 消费，猹的出现时间编码的是实际触发时刻（低四位 4）而非名义触发刻；
# 猹6 是未来对照刻（时 102），用于识别"当刻全消费"型退化实现

原点: [1,1,1]
使用网格坐标: true
time: 100
ticks:
  - 创时: 100
    于: [1,1,1]
    块: 猹
    时: 95
  - 创时: 100
    于: [1,1,3]
    块: 猹
    时: 99
  - 创时: 100
    于: [1,2,2]
    块: 猹
    时: 100
  - 创时: 100
    于: [1,2,1]
    块: 猹
    时: 102
